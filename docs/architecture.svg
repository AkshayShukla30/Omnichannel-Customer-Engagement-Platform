<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b79"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f1f4f6"/>
  <text x="30" y="36" font-size="20" font-weight="600" fill="#17212b">Omnichannel Customer Engagement Platform</text>
  <text x="30" y="56" fill="#5d6b79">One Spring Boot application, four feature modules, MySQL underneath</text>

  <rect x="30" y="120" width="190" height="110" rx="8" fill="#fff" stroke="#b8c2cc"/>
  <text x="125" y="146" text-anchor="middle" font-weight="600">Browser</text>
  <text x="125" y="170" text-anchor="middle">Agent desktop</text>
  <text x="125" y="190" text-anchor="middle">Dashboard (Chart.js)</text>
  <text x="125" y="210" text-anchor="middle">Swagger UI</text>

  <rect x="260" y="80" width="470" height="370" rx="10" fill="#e9eef1" stroke="#17212b" stroke-width="1.5"/>
  <text x="280" y="106" font-weight="600" fill="#17212b">Spring Boot app (Java 17)</text>

  <rect x="280" y="120" width="205" height="115" rx="8" fill="#fff" stroke="#0e5a64" stroke-width="1.5"/>
  <text x="382" y="143" text-anchor="middle" font-weight="600" fill="#0e5a64">agent</text>
  <text x="382" y="166" text-anchor="middle">session login, screen pop</text>
  <text x="382" y="186" text-anchor="middle">notes, disposition, close</text>
  <text x="382" y="214" text-anchor="middle" fill="#5d6b79">REST + static HTML/JS</text>

  <rect x="505" y="120" width="205" height="115" rx="8" fill="#fff" stroke="#0e5a64" stroke-width="1.5"/>
  <text x="607" y="143" text-anchor="middle" font-weight="600" fill="#0e5a64">routing</text>
  <text x="607" y="166" text-anchor="middle">priority queue per skill</text>
  <text x="607" y="186" text-anchor="middle">Strategy: longest-idle / least-busy</text>
  <text x="607" y="214" text-anchor="middle" fill="#5d6b79">TelephonyProvider + simulator</text>

  <rect x="280" y="265" width="205" height="165" rx="8" fill="#fff" stroke="#0e5a64" stroke-width="1.5"/>
  <text x="382" y="288" text-anchor="middle" font-weight="600" fill="#0e5a64">reporting</text>
  <text x="382" y="316" text-anchor="middle">JdbcTemplate: CALL sp_*</text>
  <text x="382" y="338" text-anchor="middle">average handle time</text>
  <text x="382" y="358" text-anchor="middle">interactions per agent</text>
  <text x="382" y="378" text-anchor="middle">queue length</text>
  <text x="382" y="398" text-anchor="middle">disposition breakdown</text>

  <rect x="505" y="265" width="205" height="165" rx="8" fill="#fff" stroke="#4a4fa3" stroke-width="1.5"/>
  <text x="607" y="286" text-anchor="middle" font-weight="600" fill="#4a4fa3">integration</text>
  <text x="607" y="304" text-anchor="middle" font-size="12">CustomerDataAdapterFactory</text>
  <rect x="518" y="315" width="179" height="30" rx="5" fill="#eef0fa" stroke="#4a4fa3"/>
  <text x="607" y="335" text-anchor="middle" font-size="12">CoreBankingAdapter (SQL)</text>
  <rect x="518" y="353" width="179" height="34" rx="5" fill="#eef0fa" stroke="#4a4fa3"/>
  <text x="607" y="368" text-anchor="middle" font-size="12">MockRestCrmAdapter</text>
  <text x="607" y="382" text-anchor="middle" font-size="11" fill="#5d6b79">JSON + legacy XML</text>
  <rect x="518" y="395" width="179" height="28" rx="5" fill="#eef0fa" stroke="#4a4fa3"/>
  <text x="607" y="414" text-anchor="middle" font-size="12">FileCustomerAdapter</text>

  <rect x="780" y="110" width="150" height="80" rx="8" fill="#fff" stroke="#b8c2cc" stroke-dasharray="5 4"/>
  <text x="855" y="138" text-anchor="middle" font-weight="600">Twilio</text>
  <text x="855" y="158" text-anchor="middle" fill="#5d6b79">optional, off by default</text>
  <text x="855" y="176" text-anchor="middle" fill="#5d6b79">webhooks + REST</text>

  <rect x="780" y="335" width="150" height="62" rx="8" fill="#fff" stroke="#b8c2cc"/>
  <text x="855" y="362" text-anchor="middle" font-weight="600">Mock CRM</text>
  <text x="855" y="381" text-anchor="middle" fill="#5d6b79">/mock-crm, same app</text>
  <rect x="780" y="402" width="150" height="62" rx="8" fill="#fff" stroke="#b8c2cc"/>
  <text x="855" y="429" text-anchor="middle" font-weight="600">CSV / JSON file</text>
  <text x="855" y="448" text-anchor="middle" fill="#5d6b79">classpath or disk</text>

  <rect x="200" y="500" width="590" height="100" rx="10" fill="#fff" stroke="#17212b" stroke-width="1.5"/>
  <text x="495" y="523" text-anchor="middle" font-weight="600">MySQL 8 (Flyway migrations)</text>
  <text x="495" y="544" text-anchor="middle">agents, agent_skills, interactions, interaction_notes, core_banking_customers</text>
  <text x="495" y="564" text-anchor="middle" fill="#0e5a64">sp_avg_handle_time, sp_interactions_per_agent,</text>
  <text x="495" y="582" text-anchor="middle" fill="#0e5a64">sp_queue_length, sp_disposition_breakdown</text>

  <line x1="220" y1="175" x2="258" y2="175" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="780" y1="150" x2="712" y2="170" stroke="#5d6b79" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="485" y1="178" x2="503" y2="178" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="697" y1="370" x2="778" y2="366" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="697" y1="409" x2="778" y2="433" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="382" y1="430" x2="382" y2="498" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="392" y="470" fill="#5d6b79" font-size="12">CALL sp_*</text>
  <line x1="607" y1="430" x2="607" y2="498" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="617" y="470" fill="#5d6b79" font-size="12">SQL</text>
  <text x="30" y="500" fill="#5d6b79" font-size="12">agent and routing use Spring Data JPA</text>
  <text x="30" y="518" fill="#5d6b79" font-size="12">on the same database</text>
</svg>
